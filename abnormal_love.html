<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中式心理恐怖——《慈愛》民俗視覺版</title>
    <style>
        /* 核心氛圍：模擬舊公寓裡神明燈籠罩的暗紅與黏膩感 */
        body {
            background: radial-gradient(circle, #3a0202 0%, #0d0000 100%);
            color: #d1c2c2;
            font-family: "Noto Serif TC", "Microsoft JhengHei", serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            /* 呼吸燈特效：模擬邪神在黑暗中窺視的壓迫感 */
            animation: roomPulse 6s infinite alternate ease-in-out;
        }

        @keyframes roomPulse {
            0% { background: radial-gradient(circle, #2d0202 0%, #050000 100%); }
            100% { background: radial-gradient(circle, #4a0202 10%, #0c0000 100%); }
        }

        /* 觸發驚嚇時的瘋狂閃爍 */
        .scare-flash {
            animation: glitch 0.3s infinite !important;
        }

        @keyframes glitch {
            0% { background: #ff0000; opacity: 0.9; }
            20% { background: #000000; opacity: 1; }
            40% { background: #5a0000; }
            60% { background: #000000; }
            80% { background: #990000; }
            100% { background: #0d0000; }
        }

        /* 遊戲主外框：老舊、壓抑的邊框設計 */
        .game-window {
            width: 100%;
            max-width: 680px;
            background: rgba(10, 2, 2, 0.96);
            border: 3px double #7a0b0b;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* 用純 CSS 模擬的傳統符咒/神壇視覺區塊，代替不搭的圖片 */
        .ritual-banner {
            width: 100%;
            height: 120px;
            background: #1a0202;
            border: 1px solid #540505;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px #000;
        }

        /* 模擬神明廳那種兩盞神明燈的紅光 */
        .ritual-banner::before, .ritual-banner::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ff1111;
            border-radius: 50%;
            box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000;
            top: 45px;
        }
        .ritual-banner::before { left: 40px; }
        .ritual-banner::after { right: 40px; }

        .banner-icon {
            font-size: 2.2rem;
            color: #8b0000;
            letter-spacing: 15px;
            text-shadow: 0 0 10px rgba(255,0,0,0.8);
            font-weight: bold;
        }

        .scene-title {
            color: #ff3333;
            font-size: 1.25rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }

        /* 物品欄 */
        .inventory-title {
            font-size: 0.85rem;
            color: #cc9933;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        
        .inventory-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #080101;
            border: 1px dashed #420505;
            padding: 10px;
            margin-bottom: 25px;
            min-height: 40px;
            align-items: center;
        }

        .inventory-item {
            background: #4a0505;
            color: #ffcccc;
            border: 1px solid #990000;
            padding: 4px 10px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* 故事文本 */
        .story-text {
            font-size: 1.05rem;
            line-height: 2;
            margin-bottom: 35px;
            min-height: 160px;
            letter-spacing: 1.5px;
            border-left: 3px solid #4a0505;
            padding-left: 15px;
        }

        /* 特殊文字樣式 */
        .blood { color: #ff1111; font-weight: bold; text-shadow: 0 0 1px #000; }
        .parent-voice { color: #cc9933; font-style: italic; font-weight: bold; }
        .system { color: #666; font-size: 0.85rem; }

        /* 選項按鈕 */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-choice {
            background: #140202;
            color: #e0b3b3;
            border: 1px solid #5e0b0b;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-choice:hover {
            background: #5e0b0b;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <div class="game-window">
        <!-- 頂部民俗視覺符號區塊 -->
        <div class="ritual-banner">
            <div id="banner-text" class="banner-icon">卍 靈 慈 卍</div>
        </div>

        <div id="stage-title" class="scene-title">第一章：考前深夜的囚籠</div>

        <div class="inventory-title">🎒 目前收好的隨身隨身物品：</div>
        <div id="inventory" class="inventory-box">
            <span class="system">（口袋裡只有明天聯考要用的准考證...）</span>
        </div>

        <div id="story-display" class="story-text"></div>
        <div id="options-display" class="options-group"></div>
    </div>

<script>
    let gameState = {
        inventory: [],
        hasReadDiary: false,
        fridgeOpened: false,
        deskCut: false
    };

    const script = {
        room_start: {
            title: "【林雨婷的房間】",
            icon: "卍 靈 慈 卍",
            text: "凌晨一點。明天就是聯考了，書桌上堆滿了寫滿紅字的模擬考卷。你想開門去廚房倒口水喝，用力拉了拉門把，卻發現外面傳來沉重的鎖鏈聲——<span class='blood'>爸爸又把你反鎖在房間裡了。</span><br><br>門縫底下開始飄進來一股濃烈的硃砂與燒紙錢的煙味，伴隨著客廳裡爸爸低沉、癲狂的誦經聲。房間裡除了一張書桌、一扇焊死的鐵窗，就只有牆角那座散發著霉味的老舊樟木衣櫃。",
            getChoices: () => {
                let choices = [];
                if (!gameState.deskCut) {
                    choices.push({ text: "走向書桌，查看被膠帶封死的抽屜", next: "room_desk_locked" });
                } else {
                    choices.push({ text: "走向書桌，翻看已經割開的抽屜", next: "room_desk_unlocked" });
                }
                choices.push({ text: "走向後方貼著黃符、焊死的白鐵窗", next: "room_window" });
                choices.push({ text: "走到角落，打開那座傳出怪味的樟木衣櫃", next: "room_closet" });
                return choices;
            }
        },
        room_desk_locked: {
            title: "【書桌：被黏死的抽屜】",
            icon: "斬 斷 雜 念",
            text: "你試圖拉開抽屜，卻發現抽屜兩側被爸爸用厚重的<span class='blood'>黃色工業膠帶死死纏了十幾圈</span>，上面還用硃砂歪歪斜斜地寫著「心神專一、考取功名」的咒文。膠帶黏得極緊，徒手根本撕不開，必須找東西割開它。",
            getChoices: () => {
                let choices = [];
                if (gameState.inventory.includes("美工刀")) {
                    choices.push({ text: "【使用美工刀】對準厚重的工業膠帶用力割下去", next: "action_cut_desk" });
                }
                choices.push({ text: "退回房間中央", next: "room_start" });
                return choices;
            }
        },
        action_cut_desk: {
            title: "【書桌：秘密的主人】",
            icon: "血 債 血 償",
            text: "你拿出美工刀，對著膠帶用力劃下。隨著刺耳的「撕裂聲」，抽屜終於被猛地拉開！<br><br>裡面沒有文具，只有一本被揉得泛黃的<span class='blood'>【姐姐的舊日記】</span>，以及一把冰冷、沾著暗紅色乾涸液體的<span class='blood'>【暗門鑰匙】</span>。",
            action: () => {
                gameState.deskCut = true;
                addItem("暗門鑰匙");
            },
            getChoices: () => [
                { text: "顫抖著翻開姐姐的舊日記本", next: "action_read_diary" },
                { text: "收好鑰匙，退回房間", next: "room_start" }
            ]
        },
        room_desk_unlocked: {
            title: "【書桌：空洞的抽屜】",
            icon: "因 果 業 報",
            text: "膠帶已經被割開。抽屜大開著，裡面那本姐姐留下來的日記本像是在黑暗中盯著你。",
            getChoices: () => [
                { text: "再次閱讀姐姐的日記", next: "action_read_diary" },
                { text: "退回房間中央", next: "room_start" }
            ]
        },
        action_read_diary: {
            title: "【姐姐的遺物日記】",
            icon: "怨 氣 沖 天",
            text: "日記本上的字跡越寫越凌亂，透露出寫字者當時極度的恐懼：<br><br><i>「7月14日：媽媽生病後，爸爸從神壇抱回來一尊滿是眼睛的神像，叫靈慈母。他說這能保佑全家。」</i><br><i>「8月2日：不對勁...爸爸每天混在水裡逼媽媽喝的不是藥，是香灰和骨灰！媽媽的皮膚開始發青、長出黑斑...」</i><br><i>...「8月15日：媽媽不見了。爸爸狂熱地笑著說媽媽功德圓滿、回歸慈母身邊了。今天，爸爸摸著我的頭笑著說：『接下來輪到你考大學了，爸爸會加倍愛你...』。我好害怕，我發現了衣櫃後面的夾層，我要逃...」</i>",
            action: () => { gameState.hasReadDiary = true; },
            getChoices: () => [{ text: "闔上游記，全身直發冷。退回房間", next: "room_start" }]
        },
        room_window: {
            title: "【窗戶：鐵窗牢籠】",
            icon: "寸 步 難 行",
            text: "你撲向窗戶，但一摸到紗窗你就絕望了。白鐵窗外面，被爸爸用浸過雞血的<span class='blood'>粗麻繩</span>密密麻麻地纏繞捆綁了無數圈，上面還掛著三道沉重的銅鈴與黃符。<br><br>耳邊彷彿響起爸爸以前的訓話：<span class='parent-voice'>「外面壞人多，這符能幫你定心，不被野鬼帶壞。」</span>這是一座以愛為名的牢籠，不用工具根本剪不開。",
            getChoices: () => {
                let choices = [];
                if (gameState.inventory.includes("生鏽的鐵剪")) {
                    choices.push({ text: "【使用生鏽的鐵剪】去剪斷那些血紅色粗麻繩", next: "action_cut_window" });
                }
                choices.push({ text: "回頭尋找其他生路", next: "room_start" });
                return choices;
            }
        },
        action_cut_window: {
            title: "【結局：墜落的解脫】",
            icon: "魂 歸 西 天",
            text: "你用盡全身力氣，用鐵剪「喀擦」一聲剪斷了粗麻繩。銅鈴瞬間爆發出刺耳的尖叫！<br><br>然而，繩子斷裂的瞬間，積攢在窗框上的重力失去平衡，老舊的鐵窗整個轟然向外脫落。你整個人重心不穩，跟著鐵窗一起從二樓重重跌落到堅硬的磨石子地面上...<br><br>模糊的視線中，你看到二樓房間的窗門打開，爸爸站在那裡，抱著神像，淚流滿面地看著你：<span class='parent-voice'>「婷婷...外面的世界太髒了...你為什麼就是不肯聽爸爸的話呢...別怕，爸爸這就帶你回家...」</span>",
            getChoices: () => [{ text: "（窒息的愛化為黑夜，點擊重新輪迴）", next: "die_restart" }]
        },
        room_closet: {
            title: "【樟木衣櫃】",
            icon: "藏 污 納 垢",
            text: "你推開沉重的衣櫃門，裡面掛著幾件寬大的、洗得發黃的高中制服。撥開衣服，你發現衣櫃背板竟然有一條裂縫，後面隱約傳來冷風與濃烈的霉味。背板被一條粗鐵鍊死死鎖著。",
            getChoices: () => {
                let choices = [];
                if (!gameState.inventory.includes("美工刀") && !gameState.deskCut) {
                    choices.push({ text: "在制服口袋裡翻找，摸到了一把【美工刀】", next: "action_get_knife" });
                }
                if (gameState.inventory.includes("暗門鑰匙")) {
                    choices.push({ text: "【使用暗門鑰匙】插進鐵鍊老舊的鎖孔裡", next: "stage_altar_enter" });
                }
                choices.push({ text: "回到房間中央", next: "room_start" });
                return choices;
            }
        },
        action_get_knife: {
            title: "【制服口袋】",
            icon: "防 身 利 器",
            text: "你在衣服深處摸到了一個冰冷尖銳的物件。拿出來一看，是一把帶有乾涸黑色汙漬的<span class='blood'>【美工刀】</span>。這應該能拿來割開某些東西。",
            action: () => { addItem("美工刀"); },
            getChoices: () => [{ text: "握緊美工刀，退回房間", next: "room_start" }]
        },

        // --- 地下神壇夾層 ---
        stage_altar_enter: {
            title: "【第二章：夾層夾壁與靈慈壇】",
            icon: "眾 眼 窺 視",
            text: "鎖鏈應聲斷裂！你用力推開衣櫃背板，一股陰冷的霉味夾雜著死老鼠的臭味撲面而來。你鑽了進去，這才發現老舊公寓的夾壁間，竟然被爸爸偷偷敲出了一個隱密的地下夾層。<br><br>沿著狹窄的木梯往下走，你來到了一個點滿密密麻麻黃色蠟燭的地下室。這裡的空氣黏稠得讓人想吐。正前方擺著一座覆蓋著猩紅布料的巨大神龕，左側則放著一台發出沉重低鳴聲的綠色舊冰櫃。",
            getChoices: () => [
                { text: "走近那座覆蓋著紅布的巨大神龕", next: "altar_shrine" },
                { text: "走向那台不斷冒出森冷白氣的綠色舊冰櫃", next: "altar_fridge" }
            ]
        },
        altar_shrine: {
            title: "【神龕：靈慈母真容】",
            icon: "請 神 容易",
            text: "你顫抖著掀開神龕上的紅布。剎那間，一尊由青銅鑄造、卻長著無數複眼、觀音坐姿卻下半身滿是扭曲觸手的<span class='blood'>邪神像</span>赫然出現在眼前。神像前放著一個香爐，香爐裡插著三根流著黑色液體的「香」。",
            getChoices: () => {
                let choices = [];
                if (gameState.hasReadDiary && gameState.fridgeOpened) {
                    choices.push({ text: "【看清真相】這裡太瘋狂了，立刻尋找出口逃走！", next: "stage_final_escape" });
                } else {
                    choices.push({ text: "這尊神像在盯著你...驚恐地退回夾層中央", next: "stage_altar_enter" });
                }
                return choices;
            }
        },
        altar_fridge: {
            title: "【綠色舊冰櫃】",
            icon: "聖 體 奉 納",
            text: "你走到那台家用舊冰櫃前。冰櫃外殼用紅漆歪歪斜斜地寫著「聖體奉納」四個字，把手上黏著層層疊疊的、乾涸的脂肪與蠟油結晶。裡面正傳出奇怪的隆隆聲。",
            getChoices: () => {
                let choices = [];
                if (!gameState.fridgeOpened) {
                    choices.push({ text: "屏住呼吸，使勁拉開冰櫃大門", next: "action_open_fridge" });
                } else {
                    choices.push({ text: "冰櫃已經打開，不忍直視裡面的...", next: "action_open_fridge" });
                }
                choices.push({ text: "遠離冰櫃，退回中央", next: "stage_altar_enter" });
                return choices;
            }
        },
        action_open_fridge: {
            title: "【冰櫃：功德圓滿的媽媽】",
            icon: "慈 母 悲 憫",
            text: "你猛地拉開冰櫃！一股混雜著福馬林與肉類極度腐敗的惡臭瞬間衝擊你的面門！<br><br>在慘白的冷氣凍霧中，你看到<span class='blood'>媽媽那具早已發青、內臟被全部掏空</span>的屍體正蜷縮在裡面。她的額頭上被死死釘著一張黃符，而她乾枯冰冷的手裡，正死死握著一把用來剪神水符咒的<span class='blood'>【生鏽的鐵剪】</span>。",
            scare: true, // 觸發全螢幕黑紅閃爍
            action: () => {
                gameState.fridgeOpened = true;
                addItem("生鏽的鐵剪");
            },
            getChoices: () => [
                { text: "流著淚、強忍著嘔吐感，從媽媽乾枯的手中奪下【生鏽的鐵剪】", next: "stage_altar_enter" }
            ]
        },

        // --- 最終抉擇 ---
        stage_final_escape: {
            title: "【最終章：以愛為名的代價】",
            icon: "合 家 團 圓",
            text: "你看完了日記、目睹了媽媽的屍體。你終於明白了一切：媽媽根本不是病死，而是被爸爸當作「藥引」活活獻祭給了邪神！而明天聯考過後，下一個祭品就是你。<br><br>就在此時，地下室上方的木板突然被瘋狂砸響！傳來爸爸近乎歇斯底里的怒吼：<br><span class='parent-voice'>「婷婷？你在哪裡？你怎麼可以偷看慈母的神龕！快出來！跟爸爸一起把最後的『聰明神水』喝下去，我們一家人，就要永遠在一起了啊！！」</span><br><br>在你的面前，神壇後方有一扇通往防火巷、鎖上的生鏽大鐵門。或者，你也可以拿起沉重的青銅神像，等爸爸走下木梯時跟他拚了。",
            getChoices: () => {
                let choices = [];
                if (gameState.inventory.includes("生鏽的鐵剪")) {
                    choices.push({ text: "【逃跑】用【生鏽的鐵剪】瘋狂撬動通往後巷鐵門的生鏽鎖舌", next: "end_true" });
                }
                choices.push({ text: "【反抗】雙手舉起沉重的青銅邪神像，躲在暗處準備砸向爸爸", next: "end_bad" });
                return choices;
            }
        },
        end_true: {
            title: "【真實結局：清晨的雨水】",
            icon: "逃 出 生 天",
            text: "頭頂傳來木梯被踩斷的巨響，爸爸滿身是血地衝了進來。你哭著將【生鏽的鐵剪】死命卡進鐵門老舊的鎖縫中，全身重量壓上去瘋狂攪動！<br><br>「蹦！」老舊的鎖舌斷裂。你用盡全力推開大門，整個人跌進了外頭深夜冰冷的暴雨中。你在黑暗的防火巷裡拼命狂奔，背後傳來爸爸絕望的哭喊聲，直到你看到遠處路口巡邏警車的藍紅燈光...<br><br>你活了下來。你拒絕去參加隔天的聯考，也切斷了過去所有的聯絡。很多年後，每當有人面帶微笑對你說出<span class='blood'>「我是為你好」</span>時，你依然會驚恐得全身無法停止地發抖。那種愛，真的會吃人。",
            getChoices: () => [{ text: "（因果未了，再次墮入輪迴）", next: "die_restart" }]
        },
        end_bad: {
            title: "【毀滅結局：完美的乖女兒】",
            icon: "全 家 團 聚",
            text: "你雙手舉起神像躲在門後。當那道高大的身影衝進來時，你閉著眼睛尖叫著砸下去。但常年營養不良、精神衰弱的你根本沒有力氣，神像被爸爸一把奪走。<br><br>爸爸看著滿地狼藉與大開的冰櫃，雙眼佈滿血絲，流下了痛心的眼淚：<span class='parent-voice'>「婷婷，你怎麼就是不懂爸爸的苦心？爸爸做這一切，都是為了你的前途、為了我們這個家啊！」</span><br><br>你被死死按在地上。幾天後，村子裡多了一位成績永遠全校第一、眼神空洞、身體冰冷如石、從不開口說話的「完美女學生」。",
            getChoices: () => [{ text: "（因果未了，再次墮入輪迴）", next: "die_restart" }]
        },
        die_restart: {
            title: "【輪迴不息】",
            icon: "卍 業 障 卍",
            text: "濃烈的香灰味在空氣中消散。你再次睜開眼睛，眼前依然是那盞嗡嗡作響、忽明忽暗的日光燈，以及桌上寫著你名字的聯考通知書...儀式，又重新開始了。",
            action: () => {
                gameState = { inventory: [], hasReadDiary: false, fridgeOpened: false, deskCut: false };
            },
            getChoices: () => [{ text: "坐回書桌前...", next: "room_start" }]
        }
    };

    function addItem(item) {
        if (!gameState.inventory.includes(item)) {
            gameState.inventory.push(item);
            updateInventoryUI();
        }
    }

    function updateInventoryUI() {
        const box = document.getElementById('inventory');
        if (gameState.inventory.length === 0) {
            box.innerHTML = `<span class="system">（口袋裡只有明天聯考要用的准考證...）</span>`;
            return;
        }
        box.innerHTML = '';
        gameState.inventory.forEach(item => {
            const span = document.createElement('span');
            span.className = 'inventory-item';
            span.innerText = `📌 ${item}`;
            box.appendChild(span);
        });
    }

    function renderScene(sceneKey) {
        const scene = script[sceneKey];
        if (scene.action) scene.action();

        // 驚嚇時觸發黑紅瘋狂閃爍
        if (scene.scare) {
            document.body.classList.add('scare-flash');
            setTimeout(() => document.body.classList.remove('scare-flash'), 400);
        }

        // 更新 UI 文字與頂部符號
        document.getElementById('banner-text').innerText = scene.icon;
        document.getElementById('stage-title').innerText = scene.title;
        document.getElementById('story-display').innerHTML = scene.text;
        
        // 生成選項
        const optionsContainer = document.getElementById('options-display');
        optionsContainer.innerHTML = '';
        
        const currentChoices = scene.getChoices();
        currentChoices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'btn-choice';
            button.innerHTML = choice.text;
            button.onclick = () => renderScene(choice.next);
            optionsContainer.appendChild(button);
        });

        updateInventoryUI();
    }

    // 啟動遊戲
    renderScene('room_start');
</script>

</body>
</html>
