<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中式家庭民俗恐怖——《慈愛》</title>
    <style>
        /* 整體風格：還願式的神明燈血紅暗黑感 */
        body {
            background: radial-gradient(circle, #2b0404 0%, #050000 100%);
            color: #d1c2c2;
            font-family: "Noto Serif TC", "New Computer Modern Math", serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 遊戲主外框 */
        .game-window {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 3, 3, 0.85);
            border: 2px solid #5c0606;
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.4);
            padding: 30px;
            box-sizing: border-box;
            border-radius: 4px;
        }

        /* 頂部場景標題 */
        .scene-title {
            color: #ff3333;
            font-size: 1.4rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px dashed #5c0606;
            padding-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        /* 圖片容器：加強陰暗濾鏡 */
        .image-container {
            width: 100%;
            position: relative;
            margin-bottom: 25px;
            border: 1px solid #400303;
            overflow: hidden;
        }

        .scene-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            /* 調整濾鏡讓圖片看起來像舊照片、泛黃、陰沉 */
            filter: sepia(40%) contrast(140%) brightness(40%) hue-rotate(-20deg);
            display: block;
            transition: transform 1s ease;
        }

        /* 故事文字區塊 */
        .story-text {
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 35px;
            min-height: 150px;
            letter-spacing: 1.5px;
            color: #e0d0d0;
        }

        .blood-text {
            color: #ff1111;
            font-weight: bold;
            text-shadow: 0 0 2px #000;
        }

        .parent-voice {
            color: #cc9933;
            font-style: italic;
        }

        /* 選項按鈕群組 */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-choice {
            background: linear-gradient(to right, #1a0303, #3a0505);
            color: #ffb3b3;
            border: 1px solid #730d0d;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .btn-choice:hover {
            background: #730d0d;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transform: translateX(5px);
        }

        /* 重來按鈕 */
        .btn-restart {
            background: #ff1111;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
            letter-spacing: 5px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="game-window">
        <div class="scene-title" id="stage-title">第一幕：上鎖的乖女兒房</div>
        
        <div class="image-container">
            <!-- 這裡使用一張偏暗色調、有老舊檯燈或書桌意象的圖片 -->
            <img src="https://images.unsplash.com/photo-1544644181-1484b3fdfc62?auto=format&fit=crop&w=800&q=80" alt="陰暗書桌" class="scene-img" id="scene-image">
        </div>

        <div class="story-text" id="story-display">
            <!-- 文字會由 JavaScript 動態寫入 -->
        </div>

        <div class="options-group" id="options-display">
            <!-- 選項會由 JavaScript 動態寫入 -->
        </div>
    </div>

<script>
    // 儲存所有遊戲劇本資料
    const scriptData = {
        start: {
            title: "第一幕：上鎖的乖女兒房",
            img: "https://images.unsplash.com/photo-1544644181-1484b3fdfc62?auto=format&fit=crop&w=800&q=80",
            text: "深夜十一點半，書桌上的日光燈因為電壓不穩而發出微弱的嗡嗡聲。明天就是聯考了，你想出房門裝水，卻發現門把死死卡住——<span class='blood-text'>門從外面被鎖上了。</span><br><br>客廳傳來刺鼻的硃砂與燒紙錢的煙味，伴隨著爸爸壓低卻狂熱的呢喃聲：<br><span class='parent-voice'>「慈母降世...把婷婷身上不乾淨的業障都燒掉...這次一定能拿第一名...」</span>",
            choices: [
                { text: "用力拍打房門，大喊：「爸！放我出去！我口渴！」", next: "dad_door" },
                { text: "保持安靜，翻找堆滿考卷的書桌抽屜，尋找備用鑰匙", next: "search_desk" },
                { text: "走向後方貼著符咒的窗戶，試圖探頭向外求救", next: "look_window" }
            ]
        },
        dad_door: {
            title: "結局：【為妳好】的代價",
            img: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=800&q=80",
            text: "拍門聲戛然而止。客廳的呢喃聲也停了。<br><br>幾秒鐘後，沉重的腳步聲停在你的門外。鑰匙孔轉動，爸爸端著一碗冒著黑煙、混著不明灰燼的液體走了進來，眼神裡滿是慈愛與血絲：<br><br><span class='parent-voice'>「婷婷，外面的水有毒，會害你考不好。這是爸爸跪了三天三夜向慈母求來的『聰明水』，喝下去，你就再也不會痛苦了...」</span><br><br>你被強行灌下。意識模糊間，你看到牆上的獎狀慢慢變成了血紅色。",
            choices: [{ text: "這份愛太沉重了...（重來輪迴）", next: "start" }]
        },
        look_window: {
            title: "第一幕：窒息的鐵窗",
            img: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
            text: "你撲向窗戶，但手還沒碰到紗窗就縮了回來。不鏽鋼鐵窗外面，被爸爸用浸過雞血的粗麻繩，密密麻麻地纏繞了十幾圈，上面還死死貼著九道<span class='blood-text'>「鎮魂驅邪符」</span>。<br><br>爸爸曾說：<span class='parent-voice'>「外面壞人多，這符能保你專心唸書，不被髒東西帶壞。」</span>這裡不是房間，這是一座精緻的牢籠。",
            choices: [
                { text: "絕望地坐回書桌旁，翻找抽屜", next: "search_desk" }
            ]
        },
        search_desk: {
            title: "第二幕：抽屜底下的自白",
            img: "https://images.unsplash.com/photo-1518364538800-6bae3c2ea0f2?auto=format&fit=crop&w=800&q=80",
            text: "你在抽屜最底層沒有找到鑰匙，卻翻到了一本被撕毀的日記本，上面是你的字跡，但你卻完全不記得自己寫過：<br><br><i>「6月3日：媽媽上週被爸爸送去『神壇』後就沒回來了。爸爸今天逼我喝了符水，我的頭好痛、好暈...」</i><br><i>「6月5日：我看到了...客廳冰櫃裡裝的不是豬肉...那是媽媽...爸爸瘋了...祂們說要用媽媽的命換我的前途...下一個是我...」</i><br><br>此時，你注意到書桌後方的樟木衣櫃，後面似乎有風吹來，那裡藏著一個暗門。",
            choices: [
                { text: "使盡全力推開衣櫃，鑽進暗門", next: "dark_tunnel" },
                { text: "太害怕了，把日記藏起來，假裝沒看見並上床睡覺", next: "dad_door" }
            ]
        },
        dark_tunnel: {
            title: "最終幕：慈母的神壇",
            img: "https://images.unsplash.com/photo-1618083707368-b3823daa2726?auto=format&fit=crop&w=800&q=80",
            text: "穿過暗門，你沒有逃到室外，反而落入了家裡最隱密的地下夾層。這裡點滿了密密麻麻的黃蠟燭，空氣黏稠得令人反胃。<br><br>正前方是一座巨大的神龕，上面供奉的不是神，而是一個披著紅紗、長著無數複眼的畸形神像。神像腳下，放著媽媽那具長滿青苔的冰冷屍體，而屍體的手裡，正握著你房間後門的備用鑰匙。<br><br>外頭傳來爸爸瘋狂敲擊你房門的聲音：<span class='parent-voice'>「婷婷？你在哪裡？儀式要開始了！快出來讓爸爸愛你啊！！」</span>",
            choices: [
                { text: "【結局一】拿走媽媽手裡的鑰匙，從神壇後方的密道逃離這個家", next: "end_escape" },
                { text: "【結局二】看著死去的媽媽與瘋癲的爸爸，你崩潰了，跪在神像前倒下", next: "end_cult" }
            ]
        },
        end_escape: {
            title: "結局：【出路】（真實結局）",
            img: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?auto=format&fit=crop&w=800&q=80",
            text: "你哭著從媽媽乾枯的手中奪過鑰匙，解開了神壇後方的鐵門。你拼命地跑，迎面而來的是深夜冰冷的雨水與新鮮的空氣。<br><br>你逃出來了。你沒有參加隔天的聯考，也永遠失去了家庭。但你活了下來。<br>很多年後，每當有人對你說<span class='blood-text'>「我是為你好」</span>時，你依然會全身止不住地顫抖...",
            choices: [{ text: "再玩一次，尋找其他真相", next: "start" }]
        },
        end_cult: {
            title: "結局：【合家團圓】（毀滅結局）",
            img: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=800&q=80",
            text: "你放棄了抵抗。家庭的重壓與符水的毒素摧毀了你的意志。<br><br>當爸爸破門而入，發現倒在神壇前的你時，他流下了感動的淚水：<span class='parent-voice'>「太好了，婷婷，你終於理解爸爸的苦心了。我們一家人，永遠都不分開了...」</span><br><br>你的意識沉入黑暗。幾天後，村裡多了一個成績永遠全校第一、卻從不開口說話、身體冰冷如石的女學生。",
            choices: [{ text: "重新輪迴", next: "start" }]
        }
    };

    // 控制遊戲場景切換的函式
    function renderScene(sceneKey) {
        const scene = scriptData[sceneKey];
        
        // 更新標題、圖片、文字
        document.getElementById('stage-title').innerText = scene.title;
        document.getElementById('scene-image').src = scene.img;
        document.getElementById('story-display').innerHTML = scene.text;
        
        // 清空並重新生成選項
        const optionsContainer = document.getElementById('options-display');
        optionsContainer.innerHTML = '';
        
        scene.choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'btn-choice';
            button.innerHTML = choice.text;
            button.onclick = () => renderScene(choice.next);
            optionsContainer.appendChild(button);
        });
    }

    // 遊戲初始化
    renderScene('start');
</script>

</body>
</html>
